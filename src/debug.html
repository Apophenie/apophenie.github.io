<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Récapitulatif du barème — Numérologie</title>
<meta name="color-scheme" content="dark light">

<!-- ★ HORS DU SITE, ET DÉLIBÉRÉMENT.

     « Un récapitulatif complet sur une page sans accès autre que la saisir dans
     l'URL » (l'auteur). Aucun lien du site n'y mène, cette page n'en propose
     aucun retour, et `robots` la tient à l'écart des moteurs. Ce n'est pas une
     page du site : c'est un instrument posé à côté.

     Elle porte donc son propre point d'entrée plutôt que d'être une route du
     routeur — une route serait atteignable par navigation, et devrait être
     traduite, titrée, et tenue au niveau du reste. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<!-- ★ LES FEUILLES DU SITE, ET C'EST DÉLIBÉRÉ.

     La lightbox de chaque opérateur monte la VRAIE scène, la VRAIE barre de
     transport et le VRAI Registre — pas des imitations. Ces composants ont
     leur habillage dans `pages.css` et `controls.css` ; les priver de leur
     feuille produirait une scène nue, donc une page qui montrerait autre chose
     que ce qu'un visiteur voit. Or c'est précisément ce qu'on vient vérifier
     ici. Ces deux feuilles ne portent que des sélecteurs de classe : elles ne
     touchent à rien de l'austérité voulue du récapitulatif. -->
<link rel="stylesheet" href="styles/pages.css">
<link rel="stylesheet" href="styles/controls.css">
<link rel="stylesheet" href="styles/debug.css">
</head>
<body>
<main id="dbg"></main>
<script type="module" src="app/debug-main.js"></script>
</body>
</html>
